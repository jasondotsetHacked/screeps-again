name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install isolated MCP dependencies
        run: npm run mcp:install

      - name: Typecheck, test, and build
        run: npm run check

      - name: Set up SAM
        uses: aws-actions/setup-sam@v2

      - name: Validate and build MCP template without deployment
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          npm run mcp:validate
          npm run mcp:build
